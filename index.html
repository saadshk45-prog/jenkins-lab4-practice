
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            max-width: 520px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 16px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            background: #14532d;
            color: #86efac;
            padding: 10px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0369a1;
        }

        #message {
            margin-top: 20px;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="status">● CI/CD Pipeline Ready</div>

        <h1>My First CI/CD Website</h1>

        <p>
            This website is deployed using Docker
            and Jenkins automation.
        </p>

        <p>Project: Mini CI/CD Demo</p>

        <button onclick="showMessage()">
            Test Website
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Success! Your website is working.";
        }
    </script>
</body>
</html>
